name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Compile phone and watch apps
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :wear:assembleDebug --no-daemon

      # Any failing test fails this step, including open defect_* tests.
      - name: Unit + QA tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/qa-reports/
          if-no-files-found: ignore
